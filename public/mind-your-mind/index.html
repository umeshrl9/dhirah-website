<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mind Your Mind | Dhirah</title>

    <link
      rel="icon"
      type="image/png"
      href="/images/logos/title-image.jpg"
    />

    <!-- Existing site styles -->
    <link rel="stylesheet" href="/styles/recruitmentStyle.css" />
    <link rel="stylesheet" href="/styles/homeStyle.css" />
    <link rel="stylesheet" href="/styles/headerStyle.css" />
    <link rel="stylesheet" href="/styles/footerStyle.css" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Liter&family=Playfair+Display:wght@500;600;700&family=Roboto:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --accent: #ffc107;
        --black: #000;
        --input-bg: #1f2327;
        --border: rgba(255, 255, 255, 0.18);
      }

      /* =====================================================
         GLOBAL
      ===================================================== */

      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        overflow-x: hidden;
      }

      body {
        font-family: "IBM Plex Sans Condensed", sans-serif;
      }

      main {
        margin: 0;
        padding: 0;
        background: #000;
      }

      /* =====================================================
         NAVBAR
      ===================================================== */

      .navbar {
        position: relative !important;
        width: 100%;
        z-index: 1000;

        padding: 12px 18px;

        background: #000 !important;
      }

      .navbar.scrolled {
        background: #000 !important;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      /* =====================================================
         POSTER
         
         IMPORTANT:
         Poster is completely separate from the form.
      ===================================================== */

      .mmd-poster-section {
        width: 100%;
        margin: 0;
        padding: 0;

        background: #000;

        overflow: hidden;
      }

      .mmd-poster {
        display: block;

        width: 100%;
        height: auto;

        margin: 0;
        padding: 0;

        object-fit: contain;
        object-position: center center;
      }

      /* =====================================================
         REGISTRATION SECTION
      ===================================================== */

      .mmd-registration {
        width: 100%;

        margin: 0;
        padding: 58px 24px 80px;

        background: #000;
      }

      .mmd-registration-container {
        width: min(1050px, 100%);
        margin: 0 auto;
      }

      .mmd-heading {
        margin: 0 0 44px;

        color: #fff;

        font-family: "Playfair Display", serif;
        font-size: clamp(30px, 3vw, 42px);
        font-weight: 600;
        line-height: 1.15;

        text-align: center;
      }

      /* =====================================================
         FORM
      ===================================================== */

      #registration-form {
        width: 100%;
        margin: 0 auto;
      }

      #registration-form .mb-3 {
        margin-bottom: 28px !important;
      }

      #registration-form .form-label {
        display: block;

        margin-bottom: 9px;

        color: #fff;

        font-family: "IBM Plex Sans Condensed", sans-serif;
        font-size: 17px;
        font-weight: 600;
      }

      #registration-form .form-control,
      #registration-form .form-select {
        width: 100%;
        height: 52px;
        min-height: 52px;

        box-sizing: border-box;

        padding: 0 14px;

        color: #fff;
        background: var(--input-bg);

        border: 1px solid var(--border);
        border-radius: 7px;

        box-shadow: none;

        font-family: "IBM Plex Sans Condensed", sans-serif;
        font-size: 17px;

        transition:
          border-color 0.18s ease,
          background-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      #registration-form .form-control::placeholder {
        color: rgba(255, 255, 255, 0.72);
      }

      #registration-form .form-control:focus,
      #registration-form .form-select:focus {
        outline: none;

        color: #fff;
        background: #24282c;

        border-color: rgba(255, 193, 7, 0.85);

        box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.1);
      }

      #registration-form .form-select {
        cursor: pointer;
      }

      #registration-form .form-select option {
        background: #1f2327;
        color: #fff;
      }

      /* =====================================================
         DATE
      ===================================================== */

      .date-wrapper {
        position: relative;
      }

      .date-wrapper .form-control {
        padding-right: 50px;
      }

      input[type="date"]::-webkit-calendar-picker-indicator {
        opacity: 0;
        cursor: pointer;
      }

      .date-wrapper .bi-calendar {
        position: absolute;

        right: 17px;
        bottom: 16px;

        color: rgba(255, 255, 255, 0.95);

        font-size: 20px;

        pointer-events: none;
      }

      /* =====================================================
         SUBMIT
      ===================================================== */

      .submit-btn {
        display: block;

        width: auto;
        min-width: 185px;
        height: 52px;

        margin-top: 8px;

        padding: 0 24px;

        color: #111;
        background: var(--accent);

        border: none;
        border-radius: 7px;

        font-family: "IBM Plex Sans Condensed", sans-serif;
        font-size: 17px;
        font-weight: 700;

        box-shadow: none;

        transition:
          transform 0.16s ease,
          filter 0.16s ease;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.05);
      }

      .submit-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }

      /* =====================================================
         FOOTER
      ===================================================== */

      footer.footer-custom {
        margin: 0 !important;
        padding: 42px 20px 34px !important;

        background: #000 !important;
      }

      .social-icon {
        color: #fff !important;
        text-decoration: none;

        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
      }

      .social-icon:hover {
        color: #fff !important;
        opacity: 0.75;
        transform: translateY(-2px);
      }

      /* =====================================================
         MOBILE
      ===================================================== */

      @media (max-width: 600px) {
        .navbar {
          padding: 10px 14px;
        }

        /*
          Keep the entire poster proportional.
          It is NOT used as a background.
        */

        .mmd-poster {
          width: 100%;
          height: auto;
          object-fit: contain;
        }

        .mmd-registration {
          padding: 40px 16px 60px;
        }

        .mmd-heading {
          margin-bottom: 32px;

          font-size: 28px;
          line-height: 1.2;
        }

        #registration-form .mb-3 {
          margin-bottom: 22px !important;
        }

        #registration-form .form-label {
          margin-bottom: 7px;
          font-size: 15px;
        }

        #registration-form .form-control,
        #registration-form .form-select {
          height: 52px;
          min-height: 52px;

          font-size: 16px;
        }

        .submit-btn {
          width: 100%;
          height: 52px;

          margin-top: 5px;

          font-size: 16px;
        }

        footer.footer-custom {
          padding: 32px 16px 28px !important;
        }
      }

      /* =====================================================
         VERY SMALL PHONES
      ===================================================== */

      @media (max-width: 380px) {
        .mmd-registration {
          padding-left: 13px;
          padding-right: 13px;
        }

        .mmd-heading {
          font-size: 25px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ===================================================
         NAVBAR
    ==================================================== -->

    <header>
      <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container-fluid d-flex align-items-center">

          <a class="navbar-brand" href="/">
            <img
              src="/images/logos/dhirah-logo-main.png"
              alt="Dhirah Logo"
            />
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample01"
            aria-controls="navbarsExample01"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div
            class="collapse navbar-collapse"
            id="navbarsExample01"
          >
            <ul class="navbar-nav ms-auto mx-2">

              <li class="nav-item mx-1">
                <a class="nav-link" href="/about-us">
                  About Us
                </a>
              </li>

              <li class="nav-item mx-1">
                <a class="nav-link" href="/what-we-do">
                  What We Do
                </a>
              </li>

              <li class="nav-item mx-1">
                <a class="nav-link" href="/alumni">
                  Our Alumni
                </a>
              </li>

              <li class="nav-item mx-1">
                <a class="nav-link" href="/register">
                  Register
                </a>
              </li>

            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- ===================================================
         MAIN
    ==================================================== -->

    <main>

      <!-- =================================================
           MIND YOUR MIND POSTER
           
           THIS IS THE EXISTING CORRECT POSTER.
      ================================================== -->

      <section class="mmd-poster-section">
        <img
          src="/images/posters/mind-your-mind-poster.jpeg"
          alt="Mind Your Mind — A Gita Perspective"
          class="mmd-poster"
        />
      </section>

      <!-- =================================================
           REGISTRATION
      ================================================== -->

      <section class="mmd-registration">

        <div class="mmd-registration-container">

          <h1 class="mmd-heading">
            Mind Your Mind
          </h1>

          <form
            id="registration-form"
            action="/api/mind-your-mind-registration"
            method="POST"
            class="needs-validation"
            novalidate
          >

            <!-- FULL NAME -->

            <div class="mb-3">

              <label
                for="name"
                class="form-label"
              >
                Full Name
                <span class="text-danger">*</span>
              </label>

              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                required
                placeholder="Enter your name"
              />

              <div class="invalid-feedback">
                Please enter your name.
              </div>

            </div>

            <!-- BRANCH -->

            <div class="mb-3">

              <label
                for="branch"
                class="form-label"
              >
                Branch
                <span class="text-danger">*</span>
              </label>

              <input
                type="text"
                class="form-control"
                id="branch"
                name="branch"
                required
                placeholder="Enter your branch"
              />

              <div class="invalid-feedback">
                Please enter your branch.
              </div>

            </div>

            <!-- DATE OF BIRTH -->

            <div class="mb-3 date-wrapper">

              <label
                for="dob"
                class="form-label"
              >
                Date of Birth
                <span class="text-danger">*</span>
              </label>

              <input
                type="date"
                class="form-control"
                id="dob"
                name="dob"
                required
              />

              <i class="bi bi-calendar"></i>

              <div class="invalid-feedback">
                Please enter your date of birth.
              </div>

            </div>

            <!-- YEAR OF STUDY -->

            <div class="mb-3">

              <label
                for="year"
                class="form-label"
              >
                Year of Study
                <span class="text-danger">*</span>
              </label>

              <select
                class="form-select"
                id="year"
                name="year"
                required
              >
                <option value="">
                  Select your year
                </option>

                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>

              <div class="invalid-feedback">
                Please select your year of study.
              </div>

            </div>

            <!-- COLLEGE -->

            <div class="mb-3">

              <label
                for="college"
                class="form-label"
              >
                College
                <span class="text-danger">*</span>
              </label>

              <select
                class="form-select"
                id="college"
                name="college"
                required
              >
                <option value="">
                  Select your college
                </option>

                <option>NSUT</option>
                <option>DDUC</option>
                <option>ARSD</option>
                <option>IIT Roorkee</option>
                <option>IIT Delhi</option>
                <option>RLA</option>
                <option>Bhaskaracharya</option>
                <option>Aryabhatta</option>
                <option>VMMC</option>
              </select>

              <div class="invalid-feedback">
                Please select your college.
              </div>

            </div>

            <!-- PHONE -->

            <div class="mb-3">

              <label
                for="phone"
                class="form-label"
              >
                Phone Number
                <span class="text-danger">*</span>
              </label>

              <input
                type="tel"
                class="form-control"
                id="phone"
                name="phone"
                required
                pattern="[0-9]{10}"
                placeholder="Enter your 10-digit phone number"
              />

              <div class="invalid-feedback">
                Please enter a valid 10-digit phone number.
              </div>

            </div>

            <!-- SUBMIT -->

            <button
              type="submit"
              class="submit-btn"
            >
              Submit Application
            </button>

          </form>

        </div>

      </section>

    </main>

    <!-- ===================================================
         FOOTER
    ==================================================== -->

    <footer
      class="text-center text-white fw-bold footer-custom"
    >
      <div class="container">

        <div
          class="mb-3 d-flex justify-content-center gap-4 py-3"
        >

          <a
            href="https://www.instagram.com/dhirah_nsut/"
            class="fs-3 social-icon"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="bi bi-instagram"></i>
          </a>

          <a
            href="https://mail.google.com/mail/?view=cm&fs=1&to=dhirah.edu@gmail.com"
            class="fs-3 social-icon"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="bi bi-google"></i>
          </a>

          <a
            href="https://www.youtube.com/@Dhirahlegacy"
            class="fs-3 social-icon"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="bi bi-youtube"></i>
          </a>

          <a
            href="https://www.linkedin.com/company/dhirah-du/"
            class="fs-3 social-icon"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="bi bi-linkedin"></i>
          </a>

        </div>

        <p class="mb-0">
          &copy;
          <span id="yearFooter"></span>
          Dhirah
        </p>

      </div>
    </footer>

    <!-- ===================================================
         BOOTSTRAP JS
    ==================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ===================================================
         NAVBAR SCROLL
    ==================================================== -->

    <script>
      window.addEventListener("scroll", function () {
        const navbar = document.querySelector(".navbar");

        if (window.scrollY > 50) {
          navbar.classList.add("scrolled");
        } else {
          navbar.classList.remove("scrolled");
        }
      });
    </script>

    <!-- ===================================================
         FORM VALIDATION
    ==================================================== -->

    <script>
      const form = document.querySelector("#registration-form");
      const submitBtn = form.querySelector(
        "button[type='submit']"
      );

      form.addEventListener("submit", (e) => {
        if (!form.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();

          form.classList.add("was-validated");

          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";
      });
    </script>

    <!-- ===================================================
         EXISTING SITE SCRIPT
    ==================================================== -->

    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="/script.js"></script>

    <!-- FOOTER YEAR -->

    <script>
      document.getElementById("yearFooter").textContent =
        new Date().getFullYear();
    </script>

  </body>
</html>
