<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dhirah: A Life Less Ordinary</title>
  <link rel="icon" type="image/png" href="/images/logos/title-image.jpg" />
  <link rel="stylesheet" href="/styles/recruitmentStyle.css" />
  <link rel="stylesheet" href="/styles/homeStyle.css" />
  <link rel="stylesheet" href="/styles/headerStyle.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="/styles/footerStyle.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top">
      <div class="container-fluid d-flex align-items-center">
        <a class="navbar-brand" href="/">
          <img src="/images/logos/dhirah-logo-main.png" alt="Dhirah Logo" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample01"
          aria-controls="navbarsExample01" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarsExample01">
          <ul class="navbar-nav ms-auto mx-2">
            <li class="nav-item mx-1"><a class="nav-link" href="/about-us">About Us</a></li>
            <li class="nav-item mx-1"><a class="nav-link" href="/what-we-do">What We Do</a></li>
            <li class="nav-item mx-1"><a class="nav-link" href="/alumni">Our Alumni</a></li>
            <li class="nav-item mx-1"><a class="nav-link" href="/register">Register</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <img src="/images/recruitment-sample-banner.png" alt="Main Image" class="img-fluid" />

  <main class="recruitment-main">
    <div class="container my-5">
      <h2 class="text-center mb-4">Dhirah Creators Recruitment</h1>
      <div class="row justify-content-center">
        <div class="col-lg-8 px-3 px-sm-3 px-md-0">
          <form action="/api/vgsm-registration" method="POST" class="needs-validation" novalidate>
            
            <div class="mb-3">
              <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="name" name="name" required placeholder="Enter your name" />
              <div class="invalid-feedback">Please enter your name.</div>
            </div>

            <div class="mb-3">
              <label for="rollno" class="form-label">Roll Number <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="rollno" name="rollno" required placeholder="Enter your roll number" />
              <div class="invalid-feedback">Please enter your roll number.</div>
            </div>

            <div class="mb-3">
              <label for="branch" class="form-label">Branch <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="branch" name="branch" required placeholder="Enter your branch" />
              <div class="invalid-feedback">Please enter your branch.</div>
            </div>

            <div class="mb-3">
              <label for="year" class="form-label">Year of Study <span class="text-danger">*</span></label>
              <select class="form-select" id="year" name="year" required>
                <option value="">Select your year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
              </select>
              <div class="invalid-feedback">Please select your year of study.</div>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" id="phone" name="phone" required pattern="[0-9]{10}"
                placeholder="Enter your 10-digit phone number" />
              <div class="invalid-feedback">Please enter a valid 10-digit phone number.</div>
            </div>

            <div class="mb-3">
              <label for="role" class="form-label">Which role are you applying for? <span class="text-danger">*</span></label>
              <select class="form-select" id="role" name="role" required>
                <option value="">Select a role</option>
                <option value="Video Editor">Video Editor</option>
                <option value="Graphic Designer">Graphic Designer</option>
                <option value="Social Media Manager">Social Media Manager</option>
              </select>
              <div class="invalid-feedback">Please select a role.</div>
            </div>

            <div class="mb-3">
              <label for="skills" class="form-label">Tools / Skills you know</label>
              <input type="text" class="form-control" id="skills" name="skills" placeholder="e.g., Photoshop, Premiere Pro, Canva" />
            </div>

            <div class="mb-3">
              <label for="portfolio" class="form-label">Portfolio / Sample Work (Optional)</label>
              <input type="text" class="form-control" id="portfolio" name="portfolio" placeholder="Link to Drive/Behance/Instagram etc." />
            </div>

            <button type="submit" class="btn btn-warning mt-3 fw-bold">Submit Application</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-white fw-bold py-4 mt-5 footer-custom">
    <div class="container">
      <!-- Social Icons -->
      <div class="mb-3 d-flex justify-content-center gap-4 py-3">
        <a href="https://www.instagram.com/dhirah_nsut/" class="fs-3 social-icon" target="_blank"><i class="bi bi-instagram"></i></a>
        <a href="mailto:dhirah.edu@gmail.com" target="_blank" class="fs-3 social-icon"><i class="bi bi-google"></i></a>
        <a href="https://www.youtube.com/@Dhirahlegacy" class="fs-3 social-icon"><i class="bi bi-youtube"></i></a>
        <a href="https://www.linkedin.com/company/dhirah-du/" class="fs-3 social-icon"><i class="bi bi-linkedin"></i></a>
      </div>
      <!-- Copyright -->
      <p class="mb-0">&copy; <span id="yearFooter"></span> Dhirah</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script>
    window.addEventListener("scroll", function () {
      const navbar = document.querySelector("nav");
      if (window.scrollY > 50) {
        navbar.classList.add("scrolled");
      } else {
        navbar.classList.remove("scrolled");
      }
    });

    const form = document.querySelector("form");
    const submitBtn = form.querySelector("button[type='submit']");
    form.addEventListener("submit", (e) => {
      if (!form.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
        form.classList.add("was-validated");
        return;
      }
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
    });

    document.getElementById("yearFooter").innerText = new Date().getFullYear();
  </script>
</body>
</html>
