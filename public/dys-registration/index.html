<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dhirah: A Life Less Ordinary</title>
  <link rel="icon" type="image/png" href="/images/logos/title-image.jpg" />
  <link rel="stylesheet" href="/styles/recruitmentStyle.css" />
  <link rel="stylesheet" href="/styles/homeStyle.css" />
  <link rel="stylesheet" href="/styles/headerStyle.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
  <link rel="stylesheet" href="/styles/footerStyle.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Liter&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    /* Hide native calendar icon */
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .date-wrapper {
      position: relative;
    }

    .date-wrapper .bi-calendar {
      position: absolute;
      top: 78%;
      right: 15px;
      transform: translateY(-50%);
      pointer-events: none;
      /* lets you click the input underneath */
      color: white;
      font-size: 1rem;
      z-index: 1;
    }
  </style>

</head>

<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top">
      <div class="container-fluid d-flex align-items-center">
        <a class="navbar-brand" href="/">
          <img src="/images/logos/dhirah-logo-main.png" alt="Dhirah Logo" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample01"
          aria-controls="navbarsExample01" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarsExample01">
          <ul class="navbar-nav ms-auto mx-2">
            <li class="nav-item mx-1">
              <a class="nav-link" href="/about-us">About Us</a>
            </li>
            <li class="nav-item mx-1">
              <a class="nav-link" href="/what-we-do">What We Do</a>
            </li>
            <li class="nav-item mx-1">
              <a class="nav-link" href="/alumni">Our Alumni</a>
            </li>
            <li class="nav-item mx-1">
              <a class="nav-link" href="/register">Register</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <img src="/images/dys-card-2.jpg" alt="Main Image" class="img-fluid" />

  <main class="recruitment-main">
    <div class="container my-5">
      <h2 class="text-center mb-4">Registrations!</h2>
      <div class="row justify-content-center">
        <div class="col-lg-8 px-3 px-sm-3 px-md-0">
          <form action="/api/dys-registration" method="POST" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="name" name="name" required placeholder="Enter your name" />
              <div class="invalid-feedback">Please enter your name.</div>
            </div>

            <!-- <div class="mb-3">
              <label for="rollno" class="form-label">Roll Number <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="rollno" name="rollno" required
                placeholder="Enter your roll number" />
              <div class="invalid-feedback">
                Please enter your roll number.
              </div>
            </div> -->

            <div class="mb-3">
              <label for="branch" class="form-label">Branch <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="branch" name="branch" required
                placeholder="Enter your branch" />
              <div class="invalid-feedback">Please enter your branch.</div>
            </div>

            <!-- <div class="mb-3 date-wrapper">
              <label for="dob" class="form-label">Date of Birth <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="dob" name="dob" required />
              <i class="bi bi-calendar"></i>
              <div class="invalid-feedback">
                Please enter your date of birth.
              </div>
            </div> -->

            <div class="mb-3">
              <label for="year" class="form-label">Year of Study <span class="text-danger">*</span></label>
              <select class="form-select" id="year" name="year" required>
                <option value="">Select your year</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
              <div class="invalid-feedback">
                Please select your year of study.
              </div>
            </div>

            <div class="mb-3">
              <label for="college" class="form-label">College <span class="text-danger">*</span></label>
              <select class="form-select" id="college" name="college" required>
                <option value="">Select your college</option>
                <option>NSUT</option>
                <option>DDUC</option>
                <option>ARSD</option>
                <option>IIT Roorkee</option>
                <option>IIT Delhi</option>
                <option>GTB4CEC</option>
                <option>RLA</option>
                <option>Bhaskaracharya</option>
                <option>Aryabhatta</option>
                <option>VMMC</option>
              </select>
              <div class="invalid-feedback">Please select your college.</div>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" id="phone" name="phone" required pattern="[0-9]{10}"
                placeholder="Enter your 10-digit phone number" />
              <div class="invalid-feedback">
                Please enter a valid 10-digit phone number.
              </div>
            </div>

            <div class="mb-3">
              <label for="h_ds" class="form-label">Hosteller/Day Scholar<span class="text-danger">*</span></label>
              <select class="form-select" id="h_ds" name="h_ds" required>
                <option value="">Select the required option</option>
                <option value="Hosteller">Hosteller</option>
                <option value="Day Scholar">Day Scholar</option>
              </select>
              <div class="invalid-feedback">
                Please select the required option.
              </div>
            </div>

            <!-- Room Number Container (Optional, hidden by default) -->
            <div class="mb-3 d-none" id="roomNoContainer">
              <label for="room_no" class="form-label">Room Number</label>
              <input type="text" class="form-control" id="room_no" name="room_no"
                placeholder="Enter your room number" />
            </div>

            <button type="submit" class="btn btn-warning mt-3 fw-bold">
              Submit Application
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-white fw-bold py-4 mt-5 footer-custom">
    <div class="container">
      <!-- Social Icons -->
      <div class="mb-3 d-flex justify-content-center gap-4 py-3">
        <a href="https://www.instagram.com/dhirah_nsut/" class="fs-3 social-icon" target="_blank">
          <i class="bi bi-instagram"></i>
        </a>

        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=dhirah.edu@gmail.com" target="_blank"
          class="fs-3 social-icon">
          <i class="bi bi-google"></i>
        </a>

        <a href="https://www.youtube.com/@Dhirahlegacy" class="fs-3 social-icon">
          <i class="bi bi-youtube"></i>
        </a>

        <a href="https://www.linkedin.com/company/dhirah-du/" class="fs-3 social-icon">
          <i class="bi bi-linkedin"></i>
        </a>
      </div>

      <!-- Copyright -->
      <p class="mb-0">&copy; <span id="yearFooter"></span> Dhirah</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>
  <script>
    window.addEventListener("scroll", function () {
      const navbar = document.querySelector("nav");
      if (window.scrollY > 50) {
        navbar.classList.add("scrolled");
      } else {
        navbar.classList.remove("scrolled");
      }
    });
  </script>
  <script>
    const form = document.querySelector("form");
    const submitBtn = form.querySelector("button[type='submit']");
    const hDsSelect = document.getElementById("h_ds");
    const roomNoContainer = document.getElementById("roomNoContainer");
    const roomNoInput = document.getElementById("room_no");

    // Toggle room_no input display based on Hosteller/Day Scholar selection
    hDsSelect.addEventListener("change", function () {
      if (this.value === "Hosteller") {
        roomNoContainer.classList.remove("d-none");
      } else {
        roomNoContainer.classList.add("d-none");
        roomNoInput.value = ""; // Clear input if hidden
      }
    });

    form.addEventListener("submit", (e) => {
      if (!form.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
        form.classList.add("was-validated");
        return;
      }
      // Disable the submit button to prevent multiple clicks
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
    });
  </script>
  <script src="https://unpkg.com/scrollreveal"></script>
  <script src="/script.js"></script>
</body>

</html>
